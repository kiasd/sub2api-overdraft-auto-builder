name: Validate builder repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python3 -m compileall -q manager.py auto_update.py scripts tests
      - name: Validate manifests and secrets
        run: python3 scripts/validate_repository.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
