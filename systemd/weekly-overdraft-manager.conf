[Service]
Environment=SUB2API_PATCH_MANAGER=/opt/sub2api/plugins/weekly-overdraft/manager.sh
EnvironmentFile=-/etc/sub2api/weekly-overdraft-manager.env
EnvironmentFile=-/var/lib/sub2api-weekly-overdraft/runtime.env
# Native deployments cannot write the container-only /app path. Keep the
# paired skill registry in the persistent state volume instead.
Environment=SUB2API_REMOTE_SKILL_REGISTRY_ROOT=/var/lib/sub2api-weekly-overdraft/skill-registry
ExecStartPre=/opt/sub2api/plugins/weekly-overdraft/manager.sh apply-pending
ExecStartPost=/opt/sub2api/plugins/weekly-overdraft/manager.sh post-start-check
TimeoutStartSec=infinity
ReadWritePaths=/opt/sub2api /var/lib/sub2api-weekly-overdraft /var/lib/sub2api-weekly-overdraft/skill-registry
