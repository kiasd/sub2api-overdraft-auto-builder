[Service]
Environment=SUB2API_PATCH_MANAGER=/opt/sub2api/plugins/weekly-overdraft/manager.sh
EnvironmentFile=-/etc/sub2api/weekly-overdraft-manager.env
EnvironmentFile=-/var/lib/sub2api-weekly-overdraft/runtime.env
ExecStartPre=/opt/sub2api/plugins/weekly-overdraft/manager.sh apply-pending
ExecStartPost=/opt/sub2api/plugins/weekly-overdraft/manager.sh post-start-check
TimeoutStartSec=240
ReadWritePaths=/opt/sub2api /var/lib/sub2api-weekly-overdraft
